name: Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native target
        required: true
        default: macos-arm64
        type: choice
        options: [macos-arm64, macos-x64, windows-arm64, windows-x64]

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ fromJSON('{"macos-arm64":"macos-15","macos-x64":"macos-15-intel","windows-x64":"windows-2025","windows-arm64":"windows-11-arm"}')[inputs.target] }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Build the pinned native package
        env:
          GH_TOKEN: ${{ secrets.CLI_RELEASE_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: npm run package -- --target=${{ inputs.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: gog-achievements-${{ inputs.target }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
