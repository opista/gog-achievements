name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Native packages to build
        type: choice
        default: all
        options: [all, macos-arm64, macos-x64, windows-arm64, windows-x64]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/build.yml
    with:
      target: ${{ inputs.target || 'all' }}
      # Fork code can run offline checks, but cannot use the private CLI token.
      package: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    secrets:
      CLI_RELEASE_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CLI_RELEASE_TOKEN || '' }}
